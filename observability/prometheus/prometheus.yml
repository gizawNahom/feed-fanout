global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: relay
    static_configs:
      - targets: ["relay:8002"]

  # Compose's DNS answers the service name with every container of that service, so all
  # workers are scraped, including ones added with `docker compose up --scale worker=N`.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8001
        refresh_interval: 15s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Only exists with the backup overlay (docker-compose.backup.yml). Discovered by DNS like the
  # workers, so without it there's simply no target, rather than a target that's down.
  - job_name: pgbackrest
    dns_sd_configs:
      - names: ["pgbackrest-exporter"]
        type: A
        port: 9854
        refresh_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
