global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: relay
    static_configs:
      - targets: ["relay:8002"]

  # Compose's DNS answers the service name with every container of that service, so all
  # workers are scraped, including ones added with `docker compose up --scale worker=N`.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8001
        refresh_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
