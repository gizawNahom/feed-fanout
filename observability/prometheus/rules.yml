# Recording rules and alerts. Tested with: promtool test rules rules_test.yml
#
# Alerts are grouped by what they protect. Severity:
#   page    users are affected now: someone should look immediately
#   ticket  needs attention, but not at 3am

groups:
  # --- SLO: 99% of posts reach followers' feeds within 5 seconds ---------------------
  #
  # The error budget is the 1% of posts allowed to be slower. Rather than alerting on
  # "any slow post", alert on the *rate* the budget is being spent (burn rate). A 14.4x
  # burn would use up a 30-day budget in about 2 days. Requiring it over both a short
  # and a long window catches real problems quickly without firing on brief blips.
  - name: slo
    rules:
      - record: feed_fanout:post_to_feed_slow:ratio_rate5m
        expr: |
          1 - (
            sum(rate(feed_fanout_post_to_feed_seconds_bucket{le="5"}[5m]))
            / sum(rate(feed_fanout_post_to_feed_seconds_count[5m]))
          )
      - record: feed_fanout:post_to_feed_slow:ratio_rate1h
        expr: |
          1 - (
            sum(rate(feed_fanout_post_to_feed_seconds_bucket{le="5"}[1h]))
            / sum(rate(feed_fanout_post_to_feed_seconds_count[1h]))
          )

      - alert: PostToFeedSLOBurn
        expr: |
          feed_fanout:post_to_feed_slow:ratio_rate5m > (14.4 * 0.01)
          and
          feed_fanout:post_to_feed_slow:ratio_rate1h > (14.4 * 0.01)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Posts are reaching feeds too slowly
          description: More than 14.4% of posts took over 5s to reach followers' feeds, over both the last 5 minutes and the last hour. The 99%-within-5s SLO is burning its error budget fast. Check consumer lag, fanout duration, and the outbox.

  # --- The pipeline ---------------------------------------------------------------
  - name: pipeline
    rules:
      - alert: ConsumerLagHigh
        expr: sum(feed_fanout_worker_consumer_lag) > 1000
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Fanout workers are falling behind
          description: More than 1000 events have been waiting for 5 minutes. Scale workers, or look for a slow fanout (a celebrity) or a database problem.

      # The outbox gauges are computed by the relay, so this detects a stuck publish path
      # while the relay is up. A relay that's down is caught by TargetDown{job="relay"}.
      - alert: OutboxStuck
        expr: max(feed_fanout_outbox_oldest_age_seconds) > 60
        for: 1m
        labels:
          severity: page
        annotations:
          summary: Posts are not being published to Kafka
          description: An outbox event has been waiting over a minute while the relay is running, so Kafka is refusing or failing writes (e.g. too few brokers in sync). If the relay itself is down, these gauges vanish with it and TargetDown fires instead.

      - alert: EventsDeadLettered
        expr: sum(increase(feed_fanout_dead_letters_total[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: Events were moved to the dead-letter topic
          description: Some events could not be processed and need a human. Inspect them with `python -m feed_fanout.adapters.kafka.replay_dlt`.

      - alert: APIErrorRateHigh
        expr: |
          sum(rate(feed_fanout_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(feed_fanout_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: The API is failing requests
          description: More than 5% of API requests returned a 5xx over the last 5 minutes.

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: A process stopped reporting metrics
          description: Prometheus can't scrape one of the services; it is down or unreachable.

  # --- Backups (docker-compose.backup.yml) --------------------------------------------
  #
  # Metric names come from postgres_exporter v0.20.1 and pgbackrest_exporter v0.24.0 (pinned
  # in the compose files). The metric contract test only covers the app's own metrics, so
  # re-check these names when upgrading either exporter.
  - name: backups
    rules:
      # Failures alone aren't enough: Postgres tries to archive before the backup scheduler
      # has created the repository, so a fresh stack starts with a few. Failing *and* nothing
      # archived for 10 minutes means archiving is really broken.
      - alert: WALArchivingFailing
        expr: |
          increase(pg_stat_archiver_failed_count[10m]) > 0
          and increase(pg_stat_archiver_archived_count[10m]) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Postgres can't archive its WAL
          description: WAL archiving has failed for over 10 minutes without a single success. Recent changes aren't backed up (the 1-minute RPO no longer holds), and unarchived WAL piles up until the disk is full. Check the postgres container's logs for archive-push errors.

      - alert: BackupsStale
        expr: |
          max by (stanza) (pgbackrest_backup_since_last_completion_seconds{backup_type="full"}) > 26 * 3600
          or pgbackrest_exporter_status == 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: No recent full backup
          description: The newest full backup is over 26 hours old (they're taken every 24), or the backup repository can't be read. Restores still work from older backups plus WAL, but take longer. Check the backup container's logs.
