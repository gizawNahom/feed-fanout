# Unit tests for the alert rules: promtool test rules rules_test.yml
# Each test feeds synthetic time series in and checks exactly when an alert fires.

rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # The SLO alert fires when half the posts are slow, over both windows...
  - interval: 1m
    input_series:
      - series: feed_fanout_post_to_feed_seconds_count
        values: 0+100x90
      - series: feed_fanout_post_to_feed_seconds_bucket{le="5"}
        values: 0+50x90
    alert_rule_test:
      - eval_time: 80m
        alertname: PostToFeedSLOBurn
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: Posts are reaching feeds too slowly
              description: More than 14.4% of posts took over 5s to reach followers' feeds, over both the last 5 minutes and the last hour. The 99%-within-5s SLO is burning its error budget fast. Check consumer lag, fanout duration, and the outbox.

  # ...but not when (almost) every post is on time.
  - interval: 1m
    input_series:
      - series: feed_fanout_post_to_feed_seconds_count
        values: 0+100x90
      - series: feed_fanout_post_to_feed_seconds_bucket{le="5"}
        values: 0+99x90
    alert_rule_test:
      - eval_time: 80m
        alertname: PostToFeedSLOBurn
        exp_alerts: []

  # A short spike doesn't fire: 5 minutes of mostly-slow posts (minutes 81-85) push the 5m
  # window over the threshold (~22% slow at 88m), but over the last hour only ~8% were slow,
  # under the 14.4% threshold. That's the second window's job.
  - interval: 1m
    input_series:
      - series: feed_fanout_post_to_feed_seconds_count
        values: 0+100x90
      - series: feed_fanout_post_to_feed_seconds_bucket{le="5"}
        values: 0+100x80 8010+10x4 8150+100x4
    promql_expr_test:
      # The short window alone would fire (1 = true)...
      - expr: feed_fanout:post_to_feed_slow:ratio_rate5m > bool 0.144
        eval_time: 88m
        exp_samples:
          - labels: "{}"
            value: 1
      # ...the long window holds it back.
      - expr: feed_fanout:post_to_feed_slow:ratio_rate1h < bool 0.144
        eval_time: 88m
        exp_samples:
          - labels: "{}"
            value: 1
    alert_rule_test:
      - eval_time: 88m
        alertname: PostToFeedSLOBurn
        exp_alerts: []

  # The outbox alert fires once an event has waited over a minute, for a minute.
  - interval: 1m
    input_series:
      - series: feed_fanout_outbox_oldest_age_seconds{job="relay", instance="relay:8002"}
        values: 0 0 90 150 210
    alert_rule_test:
      - eval_time: 2m
        alertname: OutboxStuck
        exp_alerts: []
      - eval_time: 4m
        alertname: OutboxStuck
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: Posts are not being published to Kafka
              description: An outbox event has been waiting over a minute while the relay is running, so Kafka is refusing or failing writes (e.g. too few brokers in sync). If the relay itself is down, these gauges vanish with it and TargetDown fires instead.

  # Lag summed across partitions must stay high for 5 minutes.
  - interval: 1m
    input_series:
      - series: feed_fanout_consumer_group_lag{job="relay", instance="relay:8002", partition="0"}
        values: 600x10
      - series: feed_fanout_consumer_group_lag{job="relay", instance="relay:8002", partition="1"}
        values: 600x10
    alert_rule_test:
      - eval_time: 3m
        alertname: ConsumerLagHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: ConsumerLagHigh
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: Fanout workers are falling behind
              description: More than 1000 events have been waiting for 5 minutes. Scale workers, or look for a slow fanout (a celebrity), a stuck worker, or a database problem.

  - interval: 1m
    input_series:
      - series: up{job="worker", instance="w1:8001"}
        values: 1 1 0 0 0
    alert_rule_test:
      - eval_time: 4m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: worker
              instance: w1:8001
            exp_annotations:
              summary: A process stopped reporting metrics
              description: Prometheus can't scrape one of the services; it is down or unreachable.

  # WAL archiving: works for 10 minutes, then every attempt fails. It fires once 10 minutes
  # have passed without a single success (20m), plus the 5 minutes of `for`...
  - interval: 1m
    input_series:
      - series: pg_stat_archiver_failed_count
        values: 0x10 1+1x30
      - series: pg_stat_archiver_archived_count
        values: 0+1x10 10x30
    alert_rule_test:
      - eval_time: 18m
        alertname: WALArchivingFailing
        exp_alerts: []  # failing, but the last success is still recent
      - eval_time: 27m
        alertname: WALArchivingFailing
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: Postgres can't archive its WAL
              description: WAL archiving has failed for over 10 minutes without a single success. Recent changes aren't backed up (the 1-minute RPO no longer holds), and unarchived WAL piles up until the disk is full. Check the postgres container's logs for archive-push errors.

  # ...but not for the failures at startup, before the repository exists.
  - interval: 1m
    input_series:
      - series: pg_stat_archiver_failed_count
        values: 0 3 9 9x27
      - series: pg_stat_archiver_archived_count
        values: 0 0 0 1+1x27
    alert_rule_test:
      - eval_time: 20m
        alertname: WALArchivingFailing
        exp_alerts: []

  # Backups: stale after 26 hours without a full backup...
  - interval: 1m
    input_series:
      - series: pgbackrest_backup_since_last_completion_seconds{backup_type="full",stanza="main"}
        values: 93000+60x30
      - series: pgbackrest_exporter_status{stanza="all-stanzas"}
        values: 1x30
    alert_rule_test:
      - eval_time: 9m
        alertname: BackupsStale
        exp_alerts: []  # 25h 59m: not yet
      - eval_time: 25m
        alertname: BackupsStale
        exp_alerts:
          - exp_labels:
              severity: ticket
              stanza: main
            exp_annotations:
              summary: No recent full backup
              description: The newest full backup is over 26 hours old (they're taken every 24), or the backup repository can't be read. Restores still work from older backups plus WAL, but take longer. Check the backup container's logs.

  # ...or when the repository can't be read at all...
  - interval: 1m
    input_series:
      - series: pgbackrest_exporter_status{stanza="all-stanzas"}
        values: 0x30
    alert_rule_test:
      - eval_time: 20m
        alertname: BackupsStale
        exp_alerts:
          - exp_labels:
              severity: ticket
              stanza: all-stanzas
            exp_annotations:
              summary: No recent full backup
              description: The newest full backup is over 26 hours old (they're taken every 24), or the backup repository can't be read. Restores still work from older backups plus WAL, but take longer. Check the backup container's logs.

  # ...but not while the daily backups keep coming (the age resets every 24 hours).
  - interval: 1h
    input_series:
      - series: pgbackrest_backup_since_last_completion_seconds{backup_type="full",stanza="main"}
        values: 0+3600x23 0+3600x23
      - series: pgbackrest_exporter_status{stanza="all-stanzas"}
        values: 1x47
    alert_rule_test:
      - eval_time: 47h
        alertname: BackupsStale
        exp_alerts: []
