# Loki as a single process, storing everything on a local volume: right for one machine.
# (At scale it runs as separate read/write components on object storage, e.g. S3.)

auth_enabled: false   # single tenant, local development

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 72h          # keep 3 days, so a laptop's disk doesn't fill up
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true         # actually delete logs past retention_period
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
