# Weekly update PRs, grouped: one PR per ecosystem per week, not one per package.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The base images in the Dockerfiles (the app's, and Postgres with pgBackRest), and the
  # service images in the compose files.
  - package-ecosystem: docker
    directories: ["/", "/backup"]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]
