# Weekly update PRs, grouped: one PR per ecosystem per week, not one per package.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The base image in the Dockerfile, and the service images in the compose files.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]
