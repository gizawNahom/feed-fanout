name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a tag: a tag can be moved to point at
# different code, a SHA can't. Dependabot keeps the SHAs (and the version comments) current.

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Formatting (ruff)
        run: uv run ruff format --check .
      - name: Types (mypy, strict)
        run: uv run mypy feed_fanout tests
      # Prometheus config valid, and the alert rules fire exactly when their tests expect.
      - name: Alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/cfg:ro" -w /cfg --entrypoint promtool \
            prom/prometheus:v3.14.0 check config prometheus.yml
          docker run --rm -v "$PWD/observability/prometheus:/cfg:ro" -w /cfg --entrypoint promtool \
            prom/prometheus:v3.14.0 test rules rules_test.yml
      - name: Log pipeline configs (Loki, Alloy)
        run: |
          docker run --rm -v "$PWD/observability/loki:/etc/loki:ro" grafana/loki:3.7.8 \
            -config.file=/etc/loki/loki.yml -verify-config
          docker run --rm -v "$PWD/observability/alloy:/cfg:ro" grafana/alloy:v1.20.1 \
            validate /cfg/config.alloy

  mutation:
    name: Mutation testing (core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      # Mutates domain/ + application/ and runs the fast tests (no Docker) against each change.
      - name: Mutation score
        run: uv run python scripts/mutation_check.py

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python >= 3.12) and newest.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      # Integration tests start real Postgres and Kafka containers via testcontainers,
      # using the runner's Docker. Run under coverage, which fails below the floor in pyproject.toml.
      - name: Tests
        run: uv run coverage run -m pytest
      - name: Coverage floor
        run: uv run coverage report

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Builds the image, starts the whole stack, and checks a post reaches a follower's feed.
      - name: Smoke test
        run: KEEP=0 scripts/smoke_test.sh

  failover:
    name: Broker failover (3-node Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Kills 1, then 2 of 3 brokers while posting, and checks that no post is lost.
      - name: Failover test
        run: scripts/failover_test.sh

  restore:
    name: Backup and point-in-time restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Posts, a backup, a mistaken DELETE FROM posts, then a restore to the moment before it,
      # through the same script the restore runbook uses.
      - name: Restore test
        run: scripts/restore_test.sh
