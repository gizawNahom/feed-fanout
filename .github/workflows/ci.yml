name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Formatting (ruff)
        run: uv run ruff format --check .
      - name: Types (mypy, strict)
        run: uv run mypy feed_fanout tests

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python >= 3.12) and newest.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      # Integration tests start real Postgres and Kafka containers via testcontainers,
      # using the runner's Docker.
      - name: Tests
        run: uv run pytest

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Builds the image, starts the whole stack, and checks a post reaches a follower's feed.
      - name: Smoke test
        run: KEEP=0 scripts/smoke_test.sh

  failover:
    name: Broker failover (3-node Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Kills 1, then 2 of 3 brokers while posting, and checks that no post is lost.
      - name: Failover test
        run: scripts/failover_test.sh
