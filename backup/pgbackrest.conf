# pgBackRest settings shared by every environment. What differs per environment comes from
# PGBACKREST_* environment variables (see docker-compose.backup.yml): where the repository lives
# (a volume here, object storage like S3 in production), and the encryption passphrase.
[global]
repo1-path=/var/lib/pgbackrest
# Keep the last 7 full backups, and the WAL needed to restore to any moment since the oldest.
repo1-retention-full=7
# Backups hold every post and follow: encrypted at rest. Passphrase: PGBACKREST_REPO1_CIPHER_PASS.
repo1-cipher-type=aes-256-cbc
compress-type=zst
# Checkpoint as soon as a backup starts, instead of waiting for the next scheduled one.
start-fast=y
# Log to the container's output, like every other service.
log-level-console=info
log-level-file=off

[main]
pg1-path=/var/lib/postgresql/18/docker
