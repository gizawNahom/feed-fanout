[project]
name = "feed-fanout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "confluent-kafka>=2.16.0",
    "fastapi>=0.143.3",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16",
    "httpx2>=2.13.1",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]  # generated by Alembic; applied migrations are never edited

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax for the target Python
    "SIM",      # simplifications
    "RUF",      # ruff-specific checks
    "S",        # security (Bandit's checks): hard-coded secrets, injection, unsafe calls, ...
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and seed random numbers on purpose. Scripts are developer tools that run
# executables from the dev environment's PATH (uv run).
"tests/**" = ["S101", "S311"]
"scripts/**" = ["S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Tests: types on fixtures help, but don't demand full annotations on every helper.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.mutmut]
# Mutation testing on the core only (pure rules and use cases), driven by the fast tests:
# the memory-assembly scenarios and the fake side of the repository contract tests.
source_paths = ["feed_fanout/"]
only_mutate = ["feed_fanout/domain/*", "feed_fanout/application/*"]
pytest_add_cli_args_test_selection = ["tests/acceptance", "tests/contracts", "tests/unit", "-k", "memory or unit"]
also_copy = ["tests/"]

[tool.coverage.run]
source = ["feed_fanout"]
branch = true

[tool.coverage.report]
# A floor, enforced in CI: a few points under what the suite reaches, so a PR that adds untested
# code fails, without making the build flaky. Raise it when coverage rises.
# Measured at 92% (2026-10-02). What's left is mostly the processes' main() and signal handlers,
# which the tests run in subprocesses, where coverage doesn't follow.
fail_under = 90
show_missing = true
skip_covered = true
