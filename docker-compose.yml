# The whole stack: `docker compose up -d --build`, then http://localhost:8000/docs
#
# Infrastructure (Kafka, Postgres, dashboards), one-shot setup (topics, migrations), and the
# app itself (API, outbox relay, fanout workers). To run the app on your machine instead
# (e.g. while developing), start only the rest:
#   docker compose up -d kafka postgres kafka-ui adminer kafka-topics migrate
#
# Local development only: well-known passwords, Kafka without auth, anonymous Grafana admin.
# So every port is published on 127.0.0.1: reachable from this machine, never from the network.

name: feed-fanout

# Shared by the app services: one image, different commands.
x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # the DOCKER listener
  DATABASE_URL: postgresql+psycopg://feed:feed@postgres:5432/feed
  LOG_FORMAT: json

x-app: &app
  build: .
  image: feed-fanout:local
  restart: unless-stopped
  environment: *app-env

# Docker keeps every line a container prints in a file on disk. Without a cap, those files
# grow for as long as the container lives; Loki is where log history is kept and searched.
x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}   # at most 30 MB per container

services:
  kafka:
    logging: *default-logging
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # Single node in KRaft mode: this one process is both broker and controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Three listeners:
      #   HOST       localhost:9092 - code running on your machine (our Python producer/consumer)
      #   DOCKER     kafka:29092    - other containers on the compose network (Kafka UI, our services)
      #   CONTROLLER :9093          - internal KRaft controller traffic
      # A client connects, then is told the "advertised" address to use, so each audience needs its own.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Internal topics default to replication factor 3, which one broker can't satisfy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topics must be created explicitly, so a typo in a topic name fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # Messages survive `docker compose down` / restarts.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web dashboard for Kafka: browse messages, partitions, consumer groups and lag.
  # http://localhost:8080
  kafka-ui:
    logging: *default-logging
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: feed-fanout
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Source of truth for posts, follows and feeds.
  postgres:
    logging: *default-logging
    image: postgres:18.6-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: feed
      POSTGRES_PASSWORD: feed   # local development only
      POSTGRES_DB: feed
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed -d feed"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web DB viewer: browse posts, follows and feeds.
  # http://localhost:8081  (System: PostgreSQL, Server: postgres, user/pass/db: feed)
  adminer:
    logging: *default-logging
    image: adminer:6.1.1
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # --- One-shot setup: runs to completion before the app starts --------------------

  # Creates the topics (idempotent). Auto-creation is off, so this is the one place they're defined.
  kafka-topics:
    logging: *default-logging
    image: apache/kafka:4.3.1
    environment:
      BOOTSTRAP: kafka:29092
      REPLICATION_FACTOR: 1   # 3 in the cluster overlay
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" --create --if-not-exists \
                     --replication-factor "$$REPLICATION_FACTOR" --topic "$$1" --partitions "$$2"; }
        create post-created 3
        create post-created.dlt 1
    restart: "no"

  # Local development only: makes a key pair (once) that stands in for an identity provider's.
  # The API mounts the public key read-only. Tokens: make token AS=alice
  dev-keys:
    logging: *default-logging
    <<: *app
    command: ["python", "-m", "feed_fanout.devtools", "keys", "--dir", "/keys"]
    restart: "no"
    volumes:
      - dev-keys:/keys

  # Applies database migrations, then exits.
  migrate:
    logging: *default-logging
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # --- The app -------------------------------------------------------------------

  # HTTP API: http://localhost:8000/docs
  api:
    logging: *default-logging
    <<: *app
    # --no-access-log: no log line per request (see the Dockerfile).
    command: ["uvicorn", "feed_fanout.adapters.http:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *app-env
      # Local development: trust tokens signed with the dev key (make token AS=alice).
      # Production instead sets AUTH_JWKS_URL (+ AUTH_ISSUER, AUTH_AUDIENCE) from its provider.
      ENVIRONMENT: dev
      AUTH_DEV_PUBLIC_KEY_FILE: /keys/public.pem
    volumes:
      - dev-keys:/keys:ro
    # Every open connection is a file descriptor. The container default (1024) ran out in the first
    # load test; ShedLoad now keeps in-flight requests bounded, and this keeps connections from
    # being the next limit.
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    depends_on:
      migrate:
        condition: service_completed_successfully
      dev-keys:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Publishes outbox rows to Kafka.
  relay:
    logging: *default-logging
    <<: *app
    command: ["python", "-m", "feed_fanout.adapters.kafka.relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      # Healthy = ready AND live (its loop is making progress). Readiness alone says "started",
      # and stays true while the loop is stuck; liveness catches that.
      test: ["CMD", "python", "-c", "import urllib.request as u; [u.urlopen(f'http://localhost:8002/health/{p}', timeout=3) for p in ('ready', 'live')]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s   # time to finish the current batch after SIGTERM

  # Fanout workers. Scale with: docker compose up -d --scale worker=3
  worker:
    logging: *default-logging
    <<: *app
    command: ["python", "-m", "feed_fanout.adapters.kafka.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      # Healthy = ready AND live (its loop is making progress). Readiness alone says "started",
      # and stays true while the loop is stuck; liveness catches that.
      test: ["CMD", "python", "-c", "import urllib.request as u; [u.urlopen(f'http://localhost:8001/health/{p}', timeout=3) for p in ('ready', 'live')]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s   # time to finish the current event after SIGTERM

  # --- Observability (optional) ---------------------------------------------------
  # docker compose --profile observability up -d --wait   (or: make up-observability)

  # Scrapes /metrics from the API, relay and every worker; evaluates the alert rules.
  # http://localhost:9090  (Alerts page: http://localhost:9090/alerts)
  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Postgres's own health for Prometheus, including WAL archiving (pg_stat_archiver), which the
  # backups depend on (see docker-compose.backup.yml).
  postgres-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: postgresql://feed:feed@postgres:5432/feed?sslmode=disable   # local development only
    depends_on:
      postgres:
        condition: service_healthy

  # Log store. Queried through Grafana (Explore -> Loki, or the dashboard's logs panels).
  loki:
    logging: *default-logging
    image: grafana/loki:3.7.8
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki:/etc/loki:ro
      - loki-data:/loki
    # No healthcheck: the image is minimal (no shell, wget or curl). Alloy and Grafana retry.

  # Collects every container's stdout and ships it to Loki. http://localhost:12345 (its UI)
  alloy:
    logging: *default-logging
    image: grafana/alloy:v1.20.1
    profiles: [observability]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      # Read-only access to the Docker API, to discover containers and read their logs.
      # Fine for local development; in production, logs come from the platform's agent
      # (e.g. a Kubernetes DaemonSet reading node log files).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started

  # Dashboards, provisioned from observability/grafana. http://localhost:3000
  grafana:
    logging: *default-logging
    image: grafana/grafana:13.2.3
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Local development only: no login, full access.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/feed-fanout.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  dev-keys:
  kafka-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
