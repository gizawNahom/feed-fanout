# The whole stack: `docker compose up -d --build`, then http://localhost:8000/docs
#
# Infrastructure (Kafka, Postgres, dashboards), one-shot setup (topics, migrations), and the
# app itself (API, outbox relay, fanout workers). To run the app on your machine instead
# (e.g. while developing), start only the rest:
#   docker compose up -d kafka postgres kafka-ui adminer kafka-topics migrate

# Shared by the app services: one image, different commands.
x-app: &app
  build: .
  image: feed-fanout:local
  restart: unless-stopped
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # the DOCKER listener
    DATABASE_URL: postgresql+psycopg://feed:feed@postgres:5432/feed
    LOG_FORMAT: json

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: feed-fanout-kafka
    ports:
      - "9092:9092"
    environment:
      # Single node in KRaft mode: this one process is both broker and controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Three listeners:
      #   HOST       localhost:9092 - code running on your machine (our Python producer/consumer)
      #   DOCKER     kafka:29092    - other containers on the compose network (Kafka UI, our services)
      #   CONTROLLER :9093          - internal KRaft controller traffic
      # A client connects, then is told the "advertised" address to use, so each audience needs its own.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Internal topics default to replication factor 3, which one broker can't satisfy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topics must be created explicitly, so a typo in a topic name fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # Messages survive `docker compose down` / restarts.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web dashboard for Kafka: browse messages, partitions, consumer groups and lag.
  # http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: feed-fanout-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: feed-fanout
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Source of truth for posts, follows and feeds.
  postgres:
    image: postgres:18.6-alpine
    container_name: feed-fanout-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: feed
      POSTGRES_PASSWORD: feed   # local development only
      POSTGRES_DB: feed
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed -d feed"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web DB viewer: browse posts, follows and feeds.
  # http://localhost:8081  (System: PostgreSQL, Server: postgres, user/pass/db: feed)
  adminer:
    image: adminer:6.1.1
    container_name: feed-fanout-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # --- One-shot setup: runs to completion before the app starts --------------------

  # Creates the topics (idempotent). Auto-creation is off, so this is the one place they're defined.
  kafka-topics:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --replication-factor 1 --topic "$$1" --partitions "$$2"; }
        create post-created 3
        create post-created.dlt 1
    restart: "no"

  # Applies database migrations, then exits.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # --- The app -------------------------------------------------------------------

  # HTTP API: http://localhost:8000/docs
  api:
    <<: *app
    command: ["uvicorn", "feed_fanout.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Publishes outbox rows to Kafka.
  relay:
    <<: *app
    command: ["python", "-m", "feed_fanout.relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s   # time to finish the current batch after SIGTERM

  # Fanout workers. Scale with: docker compose up -d --scale worker=3
  worker:
    <<: *app
    command: ["python", "-m", "feed_fanout.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s   # time to finish the current event after SIGTERM

volumes:
  kafka-data:
  postgres-data:
