services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: feed-fanout-kafka
    ports:
      - "9092:9092"
    environment:
      # Single node in KRaft mode: this one process is both broker and controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Three listeners:
      #   HOST       localhost:9092 - code running on your machine (our Python producer/consumer)
      #   DOCKER     kafka:29092    - other containers on the compose network (Kafka UI, later our services)
      #   CONTROLLER :9093          - internal KRaft controller traffic
      # A client connects, then is told the "advertised" address to use, so each audience needs its own.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Internal topics default to replication factor 3, which one broker can't satisfy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topics must be created explicitly, so a typo in a topic name fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # Messages survive `docker compose down` / restarts.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web dashboard for Kafka: browse messages, partitions, consumer groups and lag.
  # http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: feed-fanout-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: feed-fanout
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
