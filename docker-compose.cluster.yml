# Production-like Kafka: a 3-node cluster, layered on top of docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.cluster.yml up -d --build --wait
#   (or: make up-cluster)
#
# Each node is both broker and controller (KRaft combined mode); the 3 controllers form a
# quorum that survives any one node failing. Every partition is replicated to all 3 brokers,
# and a write is acknowledged only once at least 2 have it (min.insync.replicas=2, with the
# producers' acks=all), so an acknowledged event survives losing any single broker.
#
#   1 broker down  -> everything keeps working
#   2 brokers down -> writes are refused rather than accepted without a backup; the API keeps
#                     accepting posts (they wait in the outbox) and nothing is lost
#
# Switching between the single broker and this cluster needs a data reset (their metadata
# differs): docker compose down --volumes   (or: make reset)

x-cluster-kafka: &cluster-kafka
  # One id for the whole cluster: every node's storage is formatted with it.
  CLUSTER_ID: YciL_C50RA21xdah4Rxdbg   # base64 UUID, from: kafka-storage.sh random-uuid
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
  # Durability: 3 copies of everything; a write needs 2 of them.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Never elect an out-of-date replica as leader (that would silently drop acknowledged data).
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Three JVMs on one laptop: cap each one's heap.
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 12

x-bootstrap: &bootstrap kafka:29092,kafka-2:29092,kafka-3:29092

services:
  kafka:
    environment:
      <<: *cluster-kafka
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092

  kafka-2:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:9094:9092"
    environment:
      <<: *cluster-kafka
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9094,DOCKER://kafka-2:29092
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:9096:9092"
    environment:
      <<: *cluster-kafka
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9096,DOCKER://kafka-3:29092
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-topics:
    environment:
      BOOTSTRAP: *bootstrap
      REPLICATION_FACTOR: 3
    depends_on:
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  kafka-ui:
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: *bootstrap

  # Clients get all three brokers, so they can connect even if one is down.
  relay:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *bootstrap

  worker:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *bootstrap

volumes:
  kafka-2-data:
  kafka-3-data:
